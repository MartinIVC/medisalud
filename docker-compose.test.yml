services:
  db-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: medisalud_test
      POSTGRES_PASSWORD: medisalud_test_only
      POSTGRES_DB: medisalud_test
      TZ: America/Santiago
    ports:
      - "55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./database/01_init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./database/02_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 3s
      retries: 20
