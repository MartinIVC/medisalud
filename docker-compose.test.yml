name: medisalud-test

services:
  db-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: medisalud_test
      POSTGRES_PASSWORD: medisalud_test_only
      POSTGRES_DB: medisalud_test
      TZ: America/Santiago
    ports:
      - '55432:5432'
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./database/01_init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./database/02_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 3s
      retries: 20

  backend-test:
    build:
      context: ./backend
    environment:
      DB_HOST: db-test
      DB_PORT: 5432
      DB_USER: medisalud_test
      DB_PASSWORD: medisalud_test_only
      DB_NAME: medisalud_test
      SECRETARY_PASSWORD: medisalud_test_only
      SECRETARY_TOKEN_SECRET: disposable-test-secret-not-for-deployment
      TEST_DATABASE_URL: postgresql://medisalud_test:medisalud_test_only@db-test:5432/medisalud_test
      TEST_API_URL: http://backend-test:4000/api
      PUBLIC_WEB_URL: http://localhost:5173
      TZ: America/Santiago
    depends_on:
      db-test:
        condition: service_healthy
