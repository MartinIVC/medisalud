services:
  db:
    image: postgres:16-alpine
    container_name: medisalud-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-medisalud}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medisalud_secret_2026}
      POSTGRES_DB: ${POSTGRES_DB:-medisalud_db}
      TZ: America/Santiago
    ports:
      - "5432:5432"
    volumes:
      - medisalud_pgdata:/var/lib/postgresql/data
      - ./database/01_init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./database/02_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 3s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medisalud-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 4000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-medisalud}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-medisalud_secret_2026}
      DB_NAME: ${POSTGRES_DB:-medisalud_db}
      TZ: America/Santiago
      SECRETARY_PASSWORD: ${SECRETARY_PASSWORD:-}
      SECRETARY_TOKEN_SECRET: ${SECRETARY_TOKEN_SECRET:-}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-http://localhost:5173}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      SENDGRID_FROM: ${SENDGRID_FROM:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_WHATSAPP_FROM: ${TWILIO_WHATSAPP_FROM:-}
    ports:
      - "4000:4000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: medisalud-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_PROXY: http://backend:4000
    ports:
      - "5173:5173"

volumes:
  medisalud_pgdata:
