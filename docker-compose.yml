services:
  db:
    image: postgres:16-alpine
    container_name: medisalud-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: medisalud
      POSTGRES_PASSWORD: medisalud_secret_2026
      POSTGRES_DB: medisalud_db
      TZ: America/Santiago
    ports:
      - "5432:5432"
    volumes:
      - medisalud_pgdata:/var/lib/postgresql/data
      - ./database/01_init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./database/02_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medisalud -d medisalud_db"]
      interval: 3s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medisalud-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 4000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: medisalud
      DB_PASSWORD: medisalud_secret_2026
      DB_NAME: medisalud_db
      TZ: America/Santiago
    ports:
      - "4000:4000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: medisalud-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_PROXY: http://backend:4000
    ports:
      - "5173:5173"

volumes:
  medisalud_pgdata:
